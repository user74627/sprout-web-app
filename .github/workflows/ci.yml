name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build demo web
        env:
          VITE_DEMO_MODE: "true"
          BASE_URL: "/sprout-web-app/"
        run: npm run build

  functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function deps
        working-directory: functions
        run: npm install

      - name: Syntax check functions
        working-directory: functions
        run: npm run lint

